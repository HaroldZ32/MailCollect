name: build

# 用法：
#   推 v* 标签        → 三端打包 + 自动建 GitHub Release（附安装包与 SHA256）
#   手动触发          → 只打包，产物进 workflow artifacts
#   PR / 推 dev       → 只跑门禁，不打包（省时间）
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 门禁单独一个 job：PR 上只跑这个，不浪费三台机器
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke

  dist:
    name: dist-${{ matrix.target }}
    needs: verify
    # PR 只验代码，不打三端包
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # UI 构建 + 服务端单文件打包 + Electron main/preload
      - name: Build production bundle
        run: node apps/desktop/scripts/build-prod.mjs

      # 只在真的配了证书时才注入签名变量。
      # 关键：不能把空的 CSC_LINK 传下去——electron-builder 见到「已设置」就会去
      # 打开它当证书文件，macOS 上会直接报 `<项目目录> not a file` 并失败。
      - name: Signing env (only when configured)
        shell: bash
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "${{ secrets.CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "已配置代码签名证书"
          else
            echo "未配置证书，产物为未签名包"
          fi

      # 在目标平台上打包：Windows → NSIS，macOS → dmg，Linux → AppImage
      - name: Package
        working-directory: apps/desktop
        run: npx electron-builder --${{ matrix.target }} --publish never

      # Linux：直接检查真正会随 AppImage 发布的 app.asar，证明打包后的 server
      # 能启动、SQL 资产齐全、//api/* 不会落到 SPA 的 index.html。
      - name: Check packaged artifact
        if: matrix.target == 'linux'
        run: node scripts/desktop-package-check.mjs --asar apps/desktop/release/linux-unpacked/resources/app.asar

      # GitHub 会把上传文件名里的空格换成点（MailCollect Setup.exe → MailCollect.Setup.exe），
      # 所以校验和里也必须写改名后的文件名，否则 sha256sum -c 对不上。
      - name: Checksums
        shell: bash
        working-directory: apps/desktop/release
        run: |
          shopt -s nullglob
          files=(*.exe *.dmg *.AppImage)
          if [ ${#files[@]} -eq 0 ]; then echo "没有产物"; exit 1; fi
          : > "SHA256SUMS-${{ matrix.target }}.txt"
          for f in "${files[@]}"; do
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$sum  ${f// /.}" >> "SHA256SUMS-${{ matrix.target }}.txt"
          done
          cat "SHA256SUMS-${{ matrix.target }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: MailCollect-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/SHA256SUMS-*.txt

  # 只有打 tag 时才发布成正式 Release，给一个永久的公开下载地址
  release:
    name: release
    needs: dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd dist
          ls -lh
          cat SHA256SUMS-*.txt > SHA256SUMS.txt || true
          rm -f SHA256SUMS-win.txt SHA256SUMS-mac.txt SHA256SUMS-linux.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=()
          for f in dist/*.exe dist/*.dmg dist/*.AppImage dist/SHA256SUMS.txt; do
            [ -f "$f" ] && assets+=("$f")
          done
          if [ ${#assets[@]} -eq 0 ]; then
            echo "没有可发布的产物"; exit 1
          fi
          printf '待上传:%s\n' "${assets[@]}"
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MailCollect $TAG" \
            --generate-notes \
            --verify-tag

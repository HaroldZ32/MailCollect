name: build

# 用法：
#   1) 在 GitHub 上手动触发（Actions → build → Run workflow）
#   2) 或者打一个 v* 标签，自动出三端安装包
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  dist:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # 门禁先过，避免打出一个跑不起来的包
      - run: npm run typecheck
      - run: npm test

      # UI 构建 + 服务端单文件打包 + Electron main/preload
      - name: Build production bundle
        run: node apps/desktop/scripts/build-prod.mjs

      # 只在真的配了证书时才注入签名变量。
      # 关键：不能把空的 CSC_LINK 传下去——electron-builder 见到「已设置」就会去
      # 打开它当证书文件，macOS 上会直接报 `<项目目录> not a file` 并失败。
      - name: Signing env (only when configured)
        shell: bash
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "${{ secrets.CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "已配置代码签名证书"
          else
            echo "未配置证书，产物为未签名包"
          fi

      # 在目标平台上打包，Windows 走 NSIS、macOS 走 dmg、Linux 走 AppImage
      - name: Package
        working-directory: apps/desktop
        run: npx electron-builder --${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: MailCollect-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
